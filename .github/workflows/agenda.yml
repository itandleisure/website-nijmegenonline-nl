# Bouwt de agenda elke nacht opnieuw, zodat afgelopen evenementen vanzelf uit de agenda verdwijnen
# en na 3 maanden een doorverwijzing krijgen (zie tools/agenda.py).
name: Agenda bijwerken

on:
  schedule:
    - cron: "30 2 * * *"   # 03.30 of 04.30 uur Nederlandse tijd
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-bouwen
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 pillow
      # bedrijvengids: verlopen pakketten terug naar gratis, uitgelichte volgorde wisselt per dag
      - run: python tools/agenda.py && python tools/bedrijvengids.py && python tools/build.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Agenda bijgewerkt voor $(date +%F)" && git pull --rebase && git push)
