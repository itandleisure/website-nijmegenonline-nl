# Kijkt elke maandag welke bedrijven uit de bedrijvengids op hun homepage naar NijmegenOnline linken
# (tools/teruglinks.py) en slaat de uitkomst op in data/bedrijvengids-teruglinks.json.
name: Teruglinks controleren

on:
  schedule:
    - cron: "45 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-bouwen
  cancel-in-progress: false

jobs:
  controleren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/teruglinks.py
      - name: Opslaan
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add data/bedrijvengids-teruglinks.json
          git diff --cached --quiet || (git commit -m "Teruglinks van bedrijven gecontroleerd" && git pull --rebase && git push)
