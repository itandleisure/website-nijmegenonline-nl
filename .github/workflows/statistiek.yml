# Meet elke maandag hoe NijmegenOnline scoort in Google en AI-antwoorden (tools/statistiek.py) en zet de
# versleutelde cijfers in statistiek/data.json. Geheimen (Settings → Secrets and variables → Actions):
# STATISTIEK_WACHTWOORD, DATAFORSEO_LOGIN, DATAFORSEO_PASSWORD en GSC_SERVICE_ACCOUNT_JSON.
name: Statistiek bijwerken

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:
    inputs:
      ai_forceren:
        description: "AI-meting nu ook draaien (anders elke 4 weken)"
        type: boolean
        default: false
      alleen:
        description: "Alleen deze onderdelen meten, bijv. gsc (leeg = alles)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: site-bouwen
  cancel-in-progress: false

jobs:
  meten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography google-auth
      - name: Meten
        env:
          STATISTIEK_WACHTWOORD: ${{ secrets.STATISTIEK_WACHTWOORD }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: python tools/statistiek.py ${{ inputs.ai_forceren && '--ai-forceren' || '' }} ${{ inputs.alleen && format('--alleen {0}', inputs.alleen) || '' }}
      - name: Opslaan
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add statistiek/data.json
          git diff --cached --quiet || (git commit -m "Statistiek bijgewerkt" && git pull --rebase && git push)
