<script>
  /* Hoofdmenu: knop op mobiel, en het onderdeel waar je bent krijgt aria-current */
  (function () {
    var knop = document.querySelector(".kop__menuknop"), menu = document.getElementById("hoofdmenu");
    knop.addEventListener("click", function () {
      var open = knop.getAttribute("aria-expanded") !== "true";
      knop.setAttribute("aria-expanded", open);
      menu.classList.toggle("open", open);
    });
    var basis = new URL(document.querySelector(".logo").href).pathname;
    var pad = location.pathname.indexOf(basis) === 0 ? location.pathname.slice(basis.length) : "";
    menu.querySelectorAll("a").forEach(function (a) {
      var paden = (a.getAttribute("data-paden") || "").split(" ").filter(Boolean);
      var hier = a.href.replace(/[?#].*$/, "") === location.href.replace(/[?#].*$/, "").replace(/index\.html$/, "");
      if (hier || paden.some(function (p) { return pad.indexOf(p) === 0; })) a.setAttribute("aria-current", "page");
    });
  })();
</script>
